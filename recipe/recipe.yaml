# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.19.7"
  # see CHECK_ERLANG_RELEASE in Makefile
  erlang_min: "26"
  # a known latest major from erlang-feedstock
  erlang_check_max: "29"

package:
  name: elixir
  version: ${{ version }}

source:
  url: https://github.com/elixir-lang/elixir/archive/v${{ version }}.tar.gz
  sha256: a8fa0829edab5fba1394df18b2db884532be320697e2f5bd8cdf78bd9af417b3

build:
  number: 0
  skip: win
  script:
    - make prefix=${PREFIX} install

requirements:
  build:
    - git
    - make
  host:
    - erlang ${{ erlang_min }}.*
  run:
    - erlang >=${{ erlang_min }}

tests:
  - package_contents:
      strict: true
      bin:
        - elixir
        - elixirc
        - iex
        - mix
      files:
        - lib/elixir/**
        - share/man/man1/{elixir,elixirc,iex,mix}.1

  - requirements:
      run:
        - erlang ${{ erlang_min }}.*
    script:
      - elixir --version
      - mix --version
  - requirements:
      run:
        - erlang ${{ erlang_check_max }}.*
    script:
      - elixir --version
      - mix --version

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - LICENSES
  summary: Elixir is a dynamic, functional language designed for building scalable and maintainable applications
  homepage: https://elixir-lang.org
  repository: https://github.com/elixir-lang/elixir
  documentation: https://elixir-lang.org/docs.html

extra:
  recipe-maintainers:
    - bollwyvl
